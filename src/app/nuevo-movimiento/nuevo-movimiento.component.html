<div class="card shadow-sm border-primary h-100">
  <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
    <span class="fw-semibold">Nuevo movimiento</span>
    <span class="badge text-bg-light">Hijo</span>
  </div>

  <div class="card-body">
    <form (ngSubmit)="registrar()">
      <div class="mb-3">
        <label for="tipo" class="form-label">Tipo de movimiento</label>
        <select id="tipo" name="tipo" class="form-select" [(ngModel)]="tipo">
          <option value="Recarga">Recarga</option>
          <option value="Gasto">Gasto</option>
        </select>
      </div>

      <div class="mb-3">
        <label for="monto" class="form-label">Monto (S/)</label>
        <input id="monto" name="monto" type="number" step="0.01" placeholder="0.00"
               class="form-control" [class.is-invalid]="montoCtrl.dirty && formularioInvalido"
               [(ngModel)]="monto" #montoCtrl="ngModel">
      </div>

      @if (montoCtrl.dirty && montoInvalido) {
        <div class="alert alert-warning py-2">Ingresa un monto numérico mayor que cero.</div>
      }

      @if (saldoInsuficiente) {
        <div class="alert alert-danger py-2">
          Saldo insuficiente para realizar el gasto
          (disponible: S/ {{ saldo() | number: '1.2-2' }}).
        </div>
      }

      <button type="submit" class="btn btn-primary w-100" [disabled]="formularioInvalido">
        Registrar movimiento
      </button>
    </form>
  </div>
</div>
